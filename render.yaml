services:
  - type: web
    name: sentinel-api
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://drishtigrid.vercel.app"
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SIGNING_KEY
        generateValue: true
      - key: ONVIF_CREDENTIALS_KEY
        generateValue: true
    disk:
      name: sentinel-camera-data
      mountPath: /app/data
      sizeGB: 1
